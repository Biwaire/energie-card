name: Construction de la carte
# Vérifie que dist/energie-card.js correspond bien à src/energie.html (sinon : npm run build puis commit).
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: node --check dist/energie-card.js
      # si cette étape échoue : lancez « npm run build » puis committez dist/energie-card.js
      - name: Vérifier que dist est à jour
        run: git diff --exit-code dist/
